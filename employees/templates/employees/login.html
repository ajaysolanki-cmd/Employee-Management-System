
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        html, body { min-height: 100%; }
        body { padding: 16px 0; }
        .container { max-width: 100%; }
        .card { border: 0; border-radius: 14px; }
        .card-body { padding: 2rem; }
        @media (max-width: 576px) {
            body { padding: 12px; }
            .container { margin-top: 1rem !important; }
            .container .row { margin: 0; }
            .container .col-md-5 { padding: 0; }
            .card-body { padding: 1.25rem; }
            h2 { font-size: 1.5rem; }
        }
    </style>

</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="card shadow">
                    <div class="card-body">

                        <h2 class="text-center mb-4">Login</h2>

                        {% if form.errors %}
                            <div class="alert alert-danger">
                                Invalid username or password.
                                Please try again.
                            </div>
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label for="id_username"
                                       class="form-label">
                                    Username
                                </label>

                                <input
                                    type="text"
                                    name="username"
                                    id="id_username"
                                    class="form-control"
                                    required
                                    autofocus
                                >
                            </div>

                            <div class="mb-3">
                                <label for="id_password"
                                       class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    id="id_password"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100">
                                Login
                            </button>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
